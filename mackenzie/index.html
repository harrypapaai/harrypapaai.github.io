<style>
/* Mesmo sistema visual do portfólio (../index.html) */
:root{
  --white:#ffffff; --paper:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --hair:#d2d2d7;
  --night:#000000; --night-2:#161617; --night-ink:#f5f5f7; --night-muted:#a1a1a6;
  --link:#0066cc; --link-night:#2997ff; --todo:#b25000;
  --grad:linear-gradient(90deg,#2997ff 0%,#5e5ce6 55%,#bf5af2 100%);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1); --spring:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--white);color:var(--ink);font:400 17px/1.47 var(--f);letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:600}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:6px}
.todo{color:var(--todo);border-bottom:1px dashed currentColor}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
.grad{padding-right:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* NAV */
nav{position:sticky;top:0;z-index:20;height:48px;background:rgba(251,251,253,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
nav .brand{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap}
nav .back{font-size:13px;color:var(--ink);opacity:.8;white-space:nowrap}
nav .back:hover{opacity:1;text-decoration:none}

/* HERO */
.hero{text-align:center;padding:72px 0 0;overflow:hidden}
.crest{display:inline-flex;align-items:center;gap:12px;padding:6px 16px 6px 6px;border:1px solid var(--hair);border-radius:980px;background:var(--white)}
.crest img{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block}
.crest span{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.hero h1{font-size:clamp(40px,7.2vw,84px);line-height:1.04;letter-spacing:-.045em;font-weight:700;margin-top:22px}
.tagline{font-size:clamp(24px,3.6vw,40px);line-height:1.12;letter-spacing:-.035em;font-weight:600;margin-top:14px}
.lede{font-size:clamp(18px,2vw,21px);line-height:1.45;color:var(--muted);max-width:34em;margin:22px auto 0;letter-spacing:.005em}
.ctas{display:flex;justify-content:center;flex-wrap:wrap;gap:14px 30px;margin-top:28px;font-size:19px;align-items:center}
.pill{background:var(--link);color:#fff;border-radius:980px;padding:11px 22px;font-size:17px}
.pill:hover{text-decoration:none;background:#0077ed}
.chev::after{content:" ›";font-size:1.15em}

/* PAINEL DE PROGRESSO */
.stage{margin:60px auto 0;max-width:1180px;padding:0 22px}
.device{position:relative;padding:48px 48px 40px;border-radius:28px;background:radial-gradient(120% 120% at 50% 0%,#1b1f2e 0%,#05060a 70%);color:var(--night-ink);box-shadow:0 40px 80px -40px rgba(0,0,0,.45);text-align:left}
.device .top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.device .top p{font-size:15px;font-weight:600;color:var(--night-muted)}
.device .top h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.035em;line-height:1.15;margin-top:4px}
.device .when{font-size:14px;color:var(--night-muted);text-align:right}
.device .when b{display:block;color:var(--night-ink);font-size:17px;font-weight:600}
.track{display:flex;gap:6px;margin-top:30px}
.seg{position:relative;display:grid;gap:10px;min-width:0}
.seg .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.12)}
.seg.done .bar{background:#2997ff}
.seg.now .bar{background:var(--grad);box-shadow:0 0 18px rgba(94,92,230,.55)}
.seg b{font-size:14px;font-weight:600;white-space:nowrap}
.seg span{font-size:13px;color:var(--night-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.now b::after{content:" · em curso";color:#bf5af2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:36px;padding-top:28px;border-top:1px solid rgba(255,255,255,.1)}
.stats div{display:grid;gap:2px}
.stats b{font-size:clamp(28px,3.4vw,40px);font-weight:700;letter-spacing:-.04em;line-height:1.05}
.stats span{font-size:14px;color:var(--night-muted)}

/* SEÇÕES */
section{padding:112px 0}
.paper{background:var(--paper)}
.head{text-align:center;max-width:820px;margin:0 auto 56px}
.head .kicker{font-size:19px;font-weight:600;color:var(--muted);margin-bottom:8px}
.head h2{font-size:clamp(34px,5.2vw,60px);line-height:1.06;letter-spacing:-.04em}
.head p{font-size:21px;color:var(--muted);margin-top:16px;letter-spacing:.01em}

/* MÓDULOS */
.mods{display:grid;gap:22px}
.mod{position:relative;background:var(--white);border-radius:28px;padding:34px 36px 30px;box-shadow:0 30px 60px -40px rgba(0,0,0,.28);overflow:hidden}
.mod.now::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
.mod-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.mod-head h3{font-size:26px;letter-spacing:-.03em}
.mod-head .hrs{font-size:15px;color:var(--muted)}
.badge{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;border-radius:980px;border:1px solid var(--hair);color:var(--muted);background:var(--paper)}
.badge.now{color:#fff;border:0;background:var(--grad)}
.badge.done{color:#1d7a46;background:#e5f6ec;border-color:#bfe6cf}
.pairs{display:grid;grid-template-columns:1fr;gap:14px}
.pair{background:var(--paper);border-radius:20px;padding:18px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px 22px;align-items:center}
.duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px}
.disc{background:var(--white);border-radius:14px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.disc small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.disc.ia small{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.disc.ia{box-shadow:inset 0 0 0 1px rgba(94,92,230,.28)}
.disc strong{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.015em}
.disc em{font-style:normal;font-size:13px;color:var(--muted)}
.plus{align-self:center;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--white);color:#5e5ce6;font-weight:700;font-size:16px;line-height:1}
.link-work{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15.5px;line-height:1.5}
.learned{grid-column:1/-1}
.link-work svg{width:22px;height:22px;color:#2997ff;margin-top:1px}
.link-work b{font-weight:600}
.learned{margin:0;padding:12px 14px 12px 32px;background:var(--white);border-radius:14px;display:grid;gap:6px;font-size:15px}
.learned li::marker{color:#2997ff}
.final{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;background:var(--paper);border-radius:20px;padding:22px}
.final .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--grad);color:#fff}
.final .ic svg{width:24px;height:24px}
.final p{font-size:16.5px;line-height:1.5}
.final p + p{margin-top:6px;color:var(--muted);font-size:15px}

/* NA PRÁTICA */
.practice{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{display:grid;gap:10px;align-content:start;background:var(--night-2);color:var(--night-ink);border-radius:24px;padding:32px 28px;transition:transform .6s var(--spring)}
.pcard:hover{transform:translateY(-4px);text-decoration:none}
.pcard small{font-size:13px;font-weight:600;color:var(--night-muted)}
.pcard b{font-size:clamp(40px,5vw,56px);font-weight:700;letter-spacing:-.045em;line-height:1}
.pcard strong{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.pcard span{font-size:15px;color:var(--night-muted)}
.pcard .go{color:var(--link-night);font-size:15px;font-weight:600;margin-top:4px}
.more{text-align:center;margin-top:32px;font-size:19px}

footer{background:var(--paper);border-top:1px solid var(--hair);padding:22px 0 34px;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
footer a{color:var(--muted);text-decoration:underline}
.draft-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:#fff4dc;color:#8a5a00;border:1px solid #f1d9a6;border-radius:980px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 10px 30px -12px rgba(0,0,0,.3);white-space:nowrap}

/* MOVIMENTO */
@media (prefers-reduced-motion: no-preference){
  .in{animation:fadeUp 1.1s var(--spring) both;animation-delay:calc(var(--i,0) * 120ms + 80ms)}
  @supports (animation-timeline: view()){
    .reveal{animation:fadeUp linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
  }
  .seg.now .bar{animation:pulse 2.4s var(--ease) infinite}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{box-shadow:0 0 28px rgba(191,90,242,.7)}}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}

@media (max-width:834px){
  section{padding:84px 0}
  .device{padding:36px 24px 30px}
  .pair{grid-template-columns:1fr}
  .practice{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr;row-gap:22px}
  .mod{padding:28px 22px 24px}
}
@media (max-width:560px){
  .duo{grid-template-columns:1fr;gap:6px}
  .plus{justify-self:center}
  .track{flex-direction:column;gap:14px}
  .seg{flex:none!important;grid-template-columns:1fr;gap:6px}
  .seg span{white-space:normal}
  .device .when{text-align:left}
  .badge{margin-left:0}
  .final{grid-template-columns:1fr}
}
@media print{
  nav,.ctas,.draft-bar{display:none}
  .device,.pcard{background:#fff;color:#000;border:1px solid #999;box-shadow:none}
  .device .top p,.device .when,.seg span,.stats span,.pcard small,.pcard span{color:#333}
  .grad,.disc.ia small{background:none;color:#000}
  .paper,footer{background:#fff}
  .mod{border:1px solid #999;box-shadow:none;break-inside:avoid}
  section{padding:28px 0}
}
</style>
</head>
<body>
<nav aria-label="Navegação"><div class="wrap"><a class="brand" href="../" id="brand"></a><a class="back" href="../">‹ Voltar ao portfólio</a></div></nav>
<header class="hero" id="top"></header>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ============================================================
   EDITE AQUI. Todo o conteúdo da página vem deste objeto.
   - status de cada módulo: "concluido", "em curso" ou "proximo".
   - aprendi: lista do que você aprendeu em cada disciplina; fica
     oculta enquanto estiver vazia ou só com [colchetes].
   Texto entre [colchetes] só aparece abrindo a página com ?rascunho.
   ============================================================ */
const DATA = {
  nome: "Humberto Anastácio",
  linkedin: "https://www.linkedin.com/in/humberto-meireles-anastacio-b0a307176",
  curso: "MBA em Gestão de Negócios com IA",
  instituicao: "Universidade Presbiteriana Mackenzie",
  local: "Campus Higienópolis · São Paulo",
  tipo: "Pós-graduação Lato Sensu",
  periodo: "jul/2026 – dez/2027",
  duracao: "18 meses",
  fonte: "https://www.mackenzie.br/pos-graduacao/pos-e-mba/sao-paulo-higienopolis/negocios-estrategia-e-gestao/mba-em-gestao-de-negocios-com-ia",
  porque: "Trabalho com vendas B2B de infraestrutura de TI e já uso IA no dia a dia comercial: prospecção por ICP, montagem de propostas e registro no CRM. O MBA me dá a base de gestão por trás dessas decisões, e cada disciplina de gestão vem com uma de IA aplicada ao mesmo tema.",

  modulos: [
    { nome: "Módulo 1", horas: 128, status: "em curso", tema: "Estratégia, marketing e vendas",
      pares: [
        { gestao: "Estratégia e Competitividade Organizacional",
          ia: "Inteligência Artificial aplicada à Estratégia e Competitividade",
          trabalho: "Definição do ICP e escolha dos segmentos (indústria, saúde, varejo e agro) que orientam a prospecção.",
          aprendi: ["[o que aprendi nesta dupla de disciplinas]"] },
        { gestao: "Marketing e Vendas em Ambientes Digitais",
          ia: "Inteligência Artificial aplicada ao Marketing e Vendas em Ambientes Digitais",
          trabalho: "Prospecção diária com IA, cadência por e-mail, WhatsApp e LinkedIn e agendamento de diagnóstico pelo site.",
          aprendi: ["[o que aprendi nesta dupla de disciplinas]"] }
      ] },
    { nome: "Módulo 2", horas: 128, status: "proximo", tema: "Operações, projetos e processos",
      pares: [
        { gestao: "Logística e Supply Chain Management",
          ia: "Inteligência Artificial aplicada à Logística e Supply Chain Management",
          trabalho: "Cotações com distribuidores e prazos de entrega nas propostas de hardware." },
        { gestao: "Gestão de Projetos e Processos Organizacionais",
          ia: "Inteligência Artificial aplicada à Gestão de Projetos e Processos Organizacionais",
          trabalho: "Certificação CAPM® e o fluxo padronizado de propostas, da cotação do distribuidor ao PDF final." }
      ] },
    { nome: "Módulo 3", horas: 128, status: "proximo", tema: "Finanças e controladoria",
      pares: [
        { gestao: "Finanças Corporativas",
          ia: "Inteligência Artificial aplicada às Finanças Corporativas",
          trabalho: "Definição de margem e de modelo de faturamento (direto ou indireto) em cada proposta." },
        { gestao: "Controladoria",
          ia: "Inteligência Artificial aplicada à Controladoria",
          trabalho: "Indicadores comerciais e acompanhamento do pipeline no CRM." }
      ] },
    { nome: "Módulo 4", horas: 48, status: "proximo", tema: "Aplicação do Conhecimento",
      final: { texto: "Trabalho final aplicando inteligência artificial a um problema real de negócio, juntando o que foi visto nos três módulos.",
               tema: "[tema do trabalho final]" } }
  ],

  pratica: [
    { numero: "69", titulo: "Prospecção diária com IA", texto: "contas qualificadas em 14 dias úteis, a partir de um ICP definido", modulo: "Módulo 1" },
    { numero: "2,2×", titulo: "Propostas padronizadas", texto: "o valor de uma proposta ao incluir suporte recorrente de 24 meses", modulo: "Módulos 2 e 3" },
    { numero: "3", titulo: "Agendamento pelo site", texto: "vendedores em rodízio automático para os leads do site", modulo: "Módulo 1" }
  ]
};
/* ============================================================ */
const DRAFT = /[?&]rascunho\b/.test(location.search);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s ?? "").replace(/\s*\[[^\]]*\]/g, "").trim();
const filled = s => (DRAFT ? String(s ?? "").trim() : strip(s)) !== "";
const fmt = s => DRAFT ? esc(s).replace(/\[([^\]]+)\]/g, '<span class="todo" title="A preencher">[$1]</span>') : esc(strip(s));
const d = DATA;
const st = s => s === "em curso" ? "now" : s === "concluido" ? "done" : "next";
const label = { now: "Em curso", done: "Concluído", next: "Próximo" };
const totalH = d.modulos.reduce((a, m) => a + m.horas, 0);
const nDisc = d.modulos.reduce((a, m) => a + (m.pares ? m.pares.length * 2 : 0), 0);
const atual = d.modulos.find(m => st(m.status) === "now");
const doneH = d.modulos.filter(m => st(m.status) === "done").reduce((a, m) => a + m.horas, 0);
const ico = {
  work: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>'
};

document.getElementById("brand").textContent = d.nome;

document.getElementById("top").innerHTML = `
  <div class="wrap">
    <p class="crest in" style="--i:0"><img src="../logos/mackenzie.png" alt=""><span>${fmt(d.tipo)} · Mackenzie</span></p>
    <h1 class="in" style="--i:1">O que estou aprendendo na Mackenzie</h1>
    <p class="tagline in" style="--i:2">Gestão de negócios, <span class="grad">com IA em cada disciplina.</span></p>
    <p class="lede in" style="--i:3">${fmt(d.porque)}</p>
    <div class="ctas in" style="--i:4">
      <a class="pill" href="#grade">Ver as disciplinas</a>
      <a class="chev" href="../">Meu portfólio</a>
    </div>
  </div>
  <div class="stage in" style="--i:5">
    <div class="device">
      <div class="top">
        <div><p>${fmt(d.curso)}</p><h2>${atual ? `Hoje no <span class="grad">${fmt(atual.nome)}</span>: ${fmt(atual.tema.toLowerCase())}.` : "Onde estou no curso."}</h2></div>
        <p class="when"><b>${fmt(d.periodo)}</b>${fmt(d.local)}</p>
      </div>
      <div class="track" role="list" aria-label="Módulos do curso">${d.modulos.map(m => `<div class="seg ${st(m.status)}" role="listitem" style="flex:${Math.max(m.horas, 96)} 1 0"><div class="bar"></div><b>${fmt(m.nome)}</b><span>${fmt(m.tema)} · ${m.horas} h</span></div>`).join("")}</div>
      <div class="stats">
        <div><b>${totalH} h</b><span>de carga horária</span></div>
        <div><b>${d.modulos.length}</b><span>módulos</span></div>
        <div><b>${nDisc}</b><span>disciplinas, em ${nDisc / 2} pares</span></div>
        <div>${doneH ? `<b>${Math.round(doneH / totalH * 100)}%</b><span>da carga horária concluída</span>` : `<b>${fmt(d.duracao)}</b><span>de curso</span>`}</div>
      </div>
    </div>
  </div>`;

const pairHTML = p => {
  const aprendi = (p.aprendi || []).filter(filled);
  return `<div class="pair">
    <div class="duo">
      <div class="disc"><small>Gestão</small><strong>${fmt(p.gestao)}</strong><em>32 h</em></div>
      <span class="plus" aria-hidden="true">+</span>
      <div class="disc ia"><small>IA aplicada</small><strong>${fmt(p.ia)}</strong><em>32 h</em></div>
    </div>

  </div>`;
};
