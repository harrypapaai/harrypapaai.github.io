<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Links · Humberto Anastácio</title>
<meta name="description" content="Todos os links de Humberto Anastácio, Account Manager na General IT Solutions: LinkedIn, portfólio, cases e contato.">
<link rel="canonical" href="https://humbertoanastacio.github.io/links/">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://humbertoanastacio.github.io/links/">
<meta property="og:title" content="Humberto Anastácio · Links">
<meta property="og:description" content="LinkedIn, portfólio, cases e contato em um só lugar.">
<meta property="og:image" content="https://humbertoanastacio.github.io/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#05060a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232997ff'/%3E%3Cstop offset='.55' stop-color='%235e5ce6'/%3E%3Cstop offset='1' stop-color='%23bf5af2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='27' font-weight='700' fill='%23fff'%3EHA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mesmo sistema visual do portfólio, em versão escura e pensada para o celular */
:root{
  --bg:#05060a; --card:rgba(255,255,255,.06); --card-h:rgba(255,255,255,.1); --line:rgba(255,255,255,.1);
  --ink:#f5f5f7; --muted:#a1a1a6; --blue:#2997ff;
  --grad:linear-gradient(90deg,#2997ff 0%,#5e5ce6 55%,#bf5af2 100%);
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --out:cubic-bezier(.2,.8,.2,1); --bounce:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:12px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* fundo: dois brilhos em movimento */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg::before,.bg::after{content:"";position:absolute;border-radius:50%}
.bg::before{width:620px;height:620px;left:50%;top:-320px;margin-left:-310px;background:radial-gradient(circle,rgba(41,151,255,.35),transparent 62%)}
.bg::after{width:520px;height:520px;right:-260px;bottom:-260px;background:radial-gradient(circle,rgba(191,90,242,.22),transparent 62%)}

main{max-width:480px;margin:0 auto;padding:56px 20px calc(40px + env(safe-area-inset-bottom))}

/* perfil */
.profile{display:grid;justify-items:center;text-align:center}
.avatar{position:relative;width:104px;height:104px;border-radius:50%;padding:4px;display:grid;place-items:center}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#2997ff,#5e5ce6,#bf5af2,#2997ff)}
.avatar span{position:relative;width:100%;height:100%;border-radius:50%;background:#0b0d14;display:grid;place-items:center;font-size:34px;font-weight:700;letter-spacing:-.04em}
.status{position:absolute;right:4px;bottom:6px;width:20px;height:20px;border-radius:50%;background:#30d158;border:4px solid var(--bg)}
h1{margin:18px 0 0;font-size:28px;line-height:1.1;letter-spacing:-.04em;font-weight:700}
.role{margin:6px 0 0;font-size:15px;color:var(--muted)}
.bio{margin:14px 0 0;font-size:16px;line-height:1.5;max-width:30ch}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:16px}
.chips span{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:980px;padding:4px 10px}

/* links */
.links{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:12px}
.lk{position:relative;display:grid;grid-template-columns:44px 1fr 18px;gap:14px;align-items:center;padding:14px 16px 14px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:transform .35s var(--bounce),background .25s,border-color .25s;overflow:hidden}
.lk:hover{background:var(--card-h);transform:translateY(-2px) scale(1.01)}
.lk:active{transform:scale(.98)}
.lk .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff}
.lk .ic svg{width:22px;height:22px}
.lk b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.lk small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.lk .go{width:18px;height:18px;color:var(--muted);transition:transform .35s var(--bounce),color .25s}
.lk:hover .go{transform:translateX(3px);color:#fff}
.lk .demo{display:inline-block;vertical-align:2px;margin-left:8px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#ffd60a;background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.35);padding:1px 7px;border-radius:980px}
/* destaque */
.lk.top{border:0;background:linear-gradient(#10131d,#10131d) padding-box,var(--grad) border-box;border:1.5px solid transparent;padding:18px 16px 18px 14px}
.lk.top .ic{background:var(--grad)}
.lk.top b{font-size:17px}
.lk.top::after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);pointer-events:none}
/* cores de cada rede */
.ic.li{background:#0a66c2}.ic.wa{background:#25d366}.ic.mail{background:#5e5ce6}

.section-t{margin:28px 4px 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ações */
.actions{display:flex;justify-content:center;gap:10px;margin-top:28px}
.actions button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px var(--f);padding:10px 16px;border-radius:980px;cursor:pointer;transition:background .2s,transform .3s var(--bounce)}
.actions button:hover{background:var(--card-h);transform:translateY(-1px)}
.actions svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:#fff;color:#111;font-weight:600;font-size:14px;padding:10px 16px;border-radius:980px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:transform .45s var(--bounce),opacity .3s,visibility .3s;z-index:9}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

footer{margin-top:30px;text-align:center;font-size:12px;color:var(--muted)}
footer a{text-decoration:underline}
.sim{margin:0 auto 18px;max-width:480px;padding:8px 14px;border-radius:14px;background:rgba(255,214,10,.1);border:1px solid rgba(255,214,10,.3);color:#ffd60a;font-size:13px;text-align:center}

/* MOVIMENTO */
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glowA{to{transform:translate(-60px,50px) scale(1.1)}}
@keyframes glowB{to{transform:translate(-80px,-60px) scale(1.12)}}
@keyframes shine{0%,60%{left:-70%}100%{left:130%}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(48,209,88,.6)}100%{box-shadow:0 0 0 9px rgba(48,209,88,0)}}
@media (prefers-reduced-motion:no-preference){
  .bg::before{animation:glowA 12s ease-in-out infinite alternate}
  .bg::after{animation:glowB 15s ease-in-out infinite alternate}
  .avatar::before{animation:spin 6s linear infinite}
  .status{animation:ping 2s infinite}
  .profile > *,.links > li,.section-t,.actions,footer{animation:up .7s var(--out) both;animation-delay:var(--d,0s)}
  .lk.top::after{animation:shine 3.6s ease-in-out 1.6s infinite}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main id="app"></main>
<p class="toast" id="toast" role="status"></p>

<script>
/* ============================================================
   EDITE AQUI. A ordem da lista é a ordem na página.
   destaque: true  -> botão grande com borda em degradê (use em um só).
   exemplo: true   -> marca "exemplo" no botão (tire quando o link for real).
   icone: linkedin, whatsapp, email, agenda, portfolio, cases, mba, instagram, site
   ============================================================ */
const PERFIL = {
  nome: "Humberto Anastácio",
  iniciais: "HA",
  cargo: "Account Manager · General IT Solutions",
  bio: "Vendas B2B de infraestrutura de TI, com processo e IA.",
  chips: ["Infraestrutura de TI", "IA aplicada a vendas", "MBA Mackenzie"]
};
const GRUPOS = [
  { titulo: "", links: [
    { titulo: "Agende um diagnóstico de infraestrutura", sub: "Gratuito e online, cerca de 30 minutos", url: "#", icone: "agenda", destaque: true, exemplo: true },
    { titulo: "LinkedIn", sub: "Vamos nos conectar", url: "https://www.linkedin.com/in/humberto-meireles-anastacio-b0a307176", icone: "linkedin" },
    { titulo: "WhatsApp", sub: "Fale comigo direto", url: "#", icone: "whatsapp", exemplo: true },
    { titulo: "E-mail", sub: "Para propostas e contato", url: "#", icone: "email", exemplo: true }
  ] },
  { titulo: "Conheça meu trabalho", links: [
    { titulo: "Portfólio", sub: "Método, indicadores e trajetória", url: "../", icone: "portfolio" },
    { titulo: "Cases", sub: "5 problemas reais e o que fiz em cada um", url: "../#cases", icone: "cases" },
    { titulo: "O que estou aprendendo na Mackenzie", sub: "MBA em Gestão de Negócios com IA", url: "../mackenzie/", icone: "mba" }
  ] }
];
/* ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sv = (p, f) => `<svg viewBox="0 0 24 24" ${f ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${p}</svg>`;
const ICONS = {
  linkedin: sv('<path d="M6.94 8.5H3.56V20h3.38V8.5zM5.25 3A1.97 1.97 0 1 0 5.25 7a1.97 1.97 0 0 0 0-3.94zM20.44 13.4c0-3.07-1.64-4.9-4.27-4.9-1.85 0-2.82 1.02-3.27 1.73V8.5H9.53V20h3.37v-6.16c0-1.55.6-2.62 1.98-2.62 1.17 0 1.84.8 1.84 2.53V20h3.37z"/>', 1),
  whatsapp: sv('<path d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.4 4.8 5-1.3A9.8 9.8 0 1 0 12 2.2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.2-.2-.4-.3z"/>', 1),
  email: sv('<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>'),
  agenda: sv('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M8.5 14.5l2.2 2.2 4.8-4.7"/>'),
  portfolio: sv('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>'),
  cases: sv('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  mba: sv('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/>'),
  instagram: sv('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/>'),
  site: sv('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>')
};
const ICON_CLASS = { linkedin: "li", whatsapp: "wa", email: "mail" };
const ARROW = sv('<path d="M9 6l6 6-6 6"/>');
const p = PERFIL;
const temExemplo = GRUPOS.some(g => g.links.some(l => l.exemplo));
let n = 0; const delay = () => `style="--d:${(0.08 * n++).toFixed(2)}s"`;

document.getElementById("app").innerHTML = `
  ${temExemplo ? '<p class="sim">Simulação: os botões marcados com "exemplo" ainda não têm o endereço real.</p>' : ""}
  <header class="profile">
    <div class="avatar" ${delay()}><span>${esc(p.iniciais)}</span><i class="status" aria-hidden="true"></i></div>
    <h1 ${delay()}>${esc(p.nome)}</h1>
    <p class="role" ${delay()}>${esc(p.cargo)}</p>
    <p class="bio" ${delay()}>${esc(p.bio).replace("processo e IA.", '<span class="grad">processo e IA.</span>')}</p>
    <div class="chips" ${delay()}>${p.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>
  </header>
  ${GRUPOS.map(g => `
    ${g.titulo ? `<p class="section-t" ${delay()}>${esc(g.titulo)}</p>` : ""}
    <ul class="links">${g.links.map(l => `<li ${delay()}><a class="lk${l.destaque ? " top" : ""}" href="${esc(l.url)}"${/^https?:/.test(l.url) ? ' target="_blank" rel="noopener"' : ""}>
      <span class="ic ${ICON_CLASS[l.icone] || ""}">${ICONS[l.icone] || ICONS.site}</span>
      <span><b>${esc(l.titulo)}${l.exemplo ? '<em class="demo">exemplo</em>' : ""}</b>${l.sub ? `<small>${esc(l.sub)}</small>` : ""}</span>
      <span class="go">${ARROW}</span></a></li>`).join("")}</ul>`).join("")}
  <div class="actions" ${delay()}>
    <button type="button" id="share">${sv('<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/>')}Compartilhar</button>
    <button type="button" id="copy">${sv('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>')}Copiar link</button>
  </div>
  <footer ${delay()}><a href="../">humbertoanastacio.github.io</a></footer>`;

const toast = document.getElementById("toast");
const say = t => { toast.textContent = t; toast.classList.add("show"); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove("show"), 1800); };
const url = location.href.split("#")[0];
document.getElementById("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(url); say("Link copiado"); } catch { say("Não foi possível copiar"); }
});
document.getElementById("share").addEventListener("click", async () => {
  if (navigator.share) { try { await navigator.share({ title: p.nome, url }); } catch {} }
  else { try { await navigator.clipboard.writeText(url); say("Link copiado para compartilhar"); } catch { say("Não foi possível compartilhar"); } }
});
document.querySelectorAll('.lk[href="#"]').forEach(a => a.addEventListener("click", e => { e.preventDefault(); say("Link de exemplo: falta o endereço real"); }));
</script>
</body>
</html>
